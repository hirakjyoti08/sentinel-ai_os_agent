[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel: AI-Powered Autonomous OS Management & Telemetry Agent"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "groq>=0.13.0",
    "openai>=1.30.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "textual>=0.52.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.6.0",
]

[project.scripts]
sentinel = "sentinel.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
