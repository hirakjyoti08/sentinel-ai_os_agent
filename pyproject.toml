[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel: AI-Powered Autonomous OS Management & Telemetry Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-generativeai>=0.8.0",
    "groq>=0.13.0",
    "openai>=1.30.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "textual>=0.52.0",
    "rich>=13.0.0",
    "pytest>=7.4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"