name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6.0"
      - run: ruff check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # No real LLM keys in CI: tests must not depend on network providers.
      NVIDIA_API_KEY: ""
      GROQ_API_KEY: ""
      GEMINI_API_KEY: ""
      SENTINEL_DESKTOP_ALERTS: "false"
      SENTINEL_HOME: ${{ runner.temp }}/sentinel-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Smoke-test console script
        run: python -c "import shutil, sys; sys.exit(0 if shutil.which('sentinel') else 1)"
